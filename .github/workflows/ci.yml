name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pulsedesk
          POSTGRES_PASSWORD: pulsedesk_local
          POSTGRES_DB: pulsedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsedesk -d pulsedesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql://pulsedesk:pulsedesk_local@localhost:5432/pulsedesk_test
      TEST_DATABASE_URL: postgresql://pulsedesk:pulsedesk_local@localhost:5432/pulsedesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulsedesk/api prisma:validate
      - run: pnpm --filter @pulsedesk/api prisma:generate
      - run: pnpm --filter @pulsedesk/api prisma:migrate:deploy
      - run: pnpm --filter @pulsedesk/api prisma:migrate:status
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: docker compose config --quiet
